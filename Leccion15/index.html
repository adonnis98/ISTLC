<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!-- <> -->
    <H1>Consumiendo peticiones http</H1>

    <div class="container text-center">
        <div class="row">
            <div class="col-7">
                <table class="table w-100"> ">
                    <thead>
                        <tr>
                            <th>id</th>
                            <th>Nombre</th>
                            <th>Imagen</th>
                            <th>Fecha Nacimiento</th>
                            <th>Nacionalidad</th>
                        </tr>
                    </thead>
                    <tbody id="bodyTabla">
                    </tbody>
                </table>
            </div>

            <div class="col-5">
                <h2>Crear Nuevo Actor</h2>
                <div class="row mb-3">
                    <div class="col-2">
                        <label for="" class="form-label">Nombre:</label>
                    </div>
                    <div class="col">
                        <input type="text" class="form-control" id="txtnombre">
                    </div>
                </div>
                <div class="row mb-3">
                <div class="col-2">
                    <label for="" class="form-label">Imagen:</label>
                </div>
                <div class="col">
                    <input type="text" class="form-control" id="txtimagen">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-2">
                    <label for="" class="form-label">Fecha Nacimiento:</label>
                </div>
                <div class="col">
                    <input type="date" class="form-control" id="txtfechaNacimiento">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-2">
                    <label for="" class="form-label">Nacionalidad:</label>
                </div>
                <div class="col">
                    <input type="text" class="form-control" id="txtnacionalidad">
                </div>
            </div>
            <div class="row mb-3">
                <div class="col">
                    <button onclick="guardarActor()" class="btn btn-primary w-50" id="btnCrear">Crear Actor</button>
                </div>
        </div>



        <script src="script.js"></script>
</body>

</html>
