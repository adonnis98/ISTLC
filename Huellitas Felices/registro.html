<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellitas Felices - Mi Cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="Style/style.css">
</head>

<body class="bg-light d-flex align-items-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10">
                <div class="card border-0 shadow-lg overflow-hidden rounded-4">
                    <div class="row g-0">

                        <div class="col-lg-6 d-none d-lg-block img-lateral-registro"></div>

                        <div class="col-lg-6 bg-white p-4 p-md-5">

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <a href="index.html" class="fw-bold text-success text-decoration-none fs-5">
                                    <i class="bi bi-heart-pulse-fill me-1"></i> Huellitas Felices
                                </a>
                                <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill">
                                    <i class="bi bi-arrow-left"></i> Volver
                                </a>
                            </div>

                            <ul class="nav nav-pills nav-justified mb-4 bg-light p-1 rounded-pill" id="pills-tab"
                                role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active rounded-pill fw-semibold" id="tab-login"
                                        data-bs-toggle="pill" data-bs-target="#form-login" type="button" role="tab">
                                        Ingresar
                                    </button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link rounded-pill fw-semibold" id="tab-registro"
                                        data-bs-toggle="pill" data-bs-target="#form-registro" type="button" role="tab">
                                        Registrarse
                                    </button>
                                </li>
                            </ul>

                            <div class="tab-content" id="pills-tabContent">

                                <div class="tab-pane fade show active" id="form-login" role="tabpanel">
                                    <h4 class="fw-bold text-dark mb-1">¡Qué bueno verte de vuelta!</h4>
                                    <p class="text-muted small mb-4">Ingresa tus credenciales para acceder a tu perfil.
                                    </p>

                                    <form id="loginUsuario">
                                        <div class="mb-3">
                                            <label class="form-label small fw-bold text-dark">Correo Electrónico</label>
                                            <div class="input-group">
                                                <span class="input-group-text bg-light text-muted border-end-0"><i
                                                        class="bi bi-envelope"></i></span>
                                                <input type="email" class="form-control border-start-0 bg-light"
                                                    placeholder="correo@ejemplo.com" required>
                                            </div>
                                        </div>
                                        <div class="mb-4">
                                            <label class="form-label small fw-bold text-dark">Contraseña</label>
                                            <div class="input-group">
                                                <span class="input-group-text bg-light text-muted border-end-0"><i
                                                        class="bi bi-lock"></i></span>
                                                <input type="password" class="form-control border-start-0 bg-light"
                                                    placeholder="••••••••" required>
                                            </div>
                                        </div>
                                        <button type="button"
                                            class="btn btn-success w-100 py-2.5 fw-bold rounded-3 shadow-sm">
                                            Iniciar Sesión
                                        </button>
                                    </form>
                                </div>

                                <div class="tab-pane fade" id="form-registro" role="tabpanel">
                                    <h4 class="fw-bold text-dark mb-1">Crea tu cuenta</h4>
                                    <p class="text-muted small mb-4">Regístrate para agendar citas y comprar en el Pet
                                        Shop.</p>

                                    <form id="registroUsuario">
                                        <div class="mb-3">
                                            <label class="form-label small fw-bold text-dark">Nombre Completo</label>
                                            <div class="input-group">
                                                <span class="input-group-text bg-light text-muted border-end-0"><i
                                                        class="bi bi-person"></i></span>
                                                <input type="text" class="form-control border-start-0 bg-light"
                                                    placeholder="Ej. Adonis" required>
                                            </div>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label small fw-bold text-dark">Correo Electrónico</label>
                                            <div class="input-group">
                                                <span class="input-group-text bg-light text-muted border-end-0"><i
                                                        class="bi bi-envelope"></i></span>
                                                <input type="email" class="form-control border-start-0 bg-light"
                                                    placeholder="nombre@correo.com" required>
                                            </div>
                                        </div>
                                        <div class="mb-4">
                                            <label class="form-label small fw-bold text-dark">Contraseña</label>
                                            <div class="input-group">
                                                <span class="input-group-text bg-light text-muted border-end-0"><i
                                                        class="bi bi-lock"></i></span>
                                                <input type="password" class="form-control border-start-0 bg-light"
                                                    placeholder="Mínimo 6 caracteres" required>
                                            </div>
                                        </div>
                                        <button type="button"
                                            class="btn btn-success w-100 py-2.5 fw-bold rounded-3 shadow-sm">
                                            Crear Cuenta Nueva
                                        </button>
                                    </form>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/huellitas-storage.js"></script>
</body>

</html>
